---
# AAP Custom Credential Type: Infoblox NIOS Grid (WAPI)
#
# Import via Controller UI: Administration > Credential Types > Add
# Or via the ansible.platform.credential_type module (CaC — see
# aap_config/configure_aap.yml which loads THIS file as the source of truth).
#
# Maps user-supplied fields to the env vars infoblox.nios_modules reads
# automatically when the `provider` task arg is omitted.

name: Infoblox NIOS Grid
description: Username/password credential for an Infoblox NIOS Grid Master (WAPI).
kind: cloud

inputs:
  fields:
    - id: nios_host
      type: string
      label: Grid Master hostname or IP
    - id: nios_username
      type: string
      label: Username
    - id: nios_password
      type: string
      label: Password
      secret: true
    - id: nios_wapi_version
      type: string
      label: WAPI version
      default: "2.12"
    - id: nios_validate_certs
      type: boolean
      label: Validate TLS certificates
      default: true
  required:
    - nios_host
    - nios_username
    - nios_password

injectors:
  env:
    NIOS_HOST: !unsafe "{{ nios_host }}"
    NIOS_USERNAME: !unsafe "{{ nios_username }}"
    NIOS_PASSWORD: !unsafe "{{ nios_password }}"
    NIOS_WAPI_VERSION: !unsafe "{{ nios_wapi_version }}"
    NIOS_VALIDATE_CERTS: !unsafe "{{ nios_validate_certs | string | lower }}"
  extra_vars:
    infoblox_platform: nios
# ★ Insight ─────────────────────────────────────
#   - !unsafe is a YAML tag handled by Ansible's loader (AnsibleUnsafeText), not a
#    Jinja directive — it tells Ansible "wrap this string in a class that refuses
#   templating," and the wrapping survives through include_vars, set_fact, and
#   dict-key/value lookups.
#   - The extra_vars: { infoblox_platform: nios } line below didn't need !unsafe
#   because the value is a literal string with no {{ }} — protecting only what's
#   actually a template keeps the diff narrow and the intent obvious.
#   - This same pattern shows up in every AAP credential-type CaC playbook, and
#   also in any place you store Jinja that some downstream system (AAP, AWX,
#   Tower-CLI dumps, etc.) is supposed to render. Worth filing alongside the
#   "Gateway vs Controller connection split" lesson already in your memory.