---
collections:
  # On-prem NIOS Grid (certified)
  - name: infoblox.nios_modules
    version: ">=1.9.0,<2.0.0"

  # Infoblox Cloud / Universal DDI (certified)
  - name: infoblox.universal_ddi
    version: ">=1.1.0,<2.0.0"

  # netaddr / ipaddr filters used for CIDR math fallbacks
  - name: ansible.utils
    version: ">=2.0.0"

  # AAP Config-as-Code — Gateway layer (Org / Team / User / Auth).
  # Used by aap_config/configure_aap.yml.
  - name: ansible.platform
    version: ">=2.5.0"

  # AAP Config-as-Code — Controller layer. ansible.platform does NOT
  # ship a `project` module (or JT / inventory / credential_type /
  # execution_environment); those still live in ansible.controller.
  # Used alongside ansible.platform in aap_config/configure_aap.yml.
  - name: ansible.controller
    version: ">=4.5.0"
